<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocuPaz · Biblioteca de documentos</title>
    <script>
      // tema (ver src/theme.js): claro por defecto, salvo que el usuario haya elegido el oscuro. Se aplica
      // antes de pintar para que no haya parpadeo.
      var t = null;
      try { t = localStorage.getItem("neurorepo-theme"); } catch (e) {}
      if (t !== "dark") document.documentElement.dataset.theme = "light";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
