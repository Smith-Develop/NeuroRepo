services:
  app:
    build: .
    depends_on:
      mongo: { condition: service_started }
      model: { condition: service_completed_successfully }
    # La carpeta de documentos del host se monta en /app/library (solo lectura).
    # Coolify prohíbe "${...}" en el origen de un volumen (por seguridad), así que aquí NO se
    # declara el bind mount: en Coolify se añade desde Storages del propio servicio (ver CLAUDE.md).
    # En local, docker-compose.local.yml sí lo declara con DOCS_HOST_PATH.
    environment:
      # Coolify: crea el dominio y enruta al puerto 4000
      - SERVICE_FQDN_APP_4000
      - MONGODB_URI=mongodb://mongo:27017/notas-ia
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      - LIBRARY_ROOT=/app/library
      - SCAN_INTERVAL_MINUTES=${SCAN_INTERVAL_MINUTES:-15}
      - BOOTSTRAP_ADMIN_NAME=${BOOTSTRAP_ADMIN_NAME:-Administrador}
      - BOOTSTRAP_ADMIN_DNI=${BOOTSTRAP_ADMIN_DNI:?Define BOOTSTRAP_ADMIN_DNI}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:?Define BOOTSTRAP_ADMIN_PASSWORD}
    restart: unless-stopped

  mongo:
    image: mongo:7
    # Caché pequeña: por defecto Mongo reserva ~50% de la RAM del servidor
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    volumes: [mongo-data:/data/db]
    restart: unless-stopped

  # IA local. Sin puertos publicados: solo la app puede usarla.
  ollama:
    image: ollama/ollama:latest
    volumes: [ollama-data:/root/.ollama]
    environment:
      - OLLAMA_KEEP_ALIVE=24h # mantiene el modelo cargado en RAM
    mem_limit: 4g # tope para no ahogar al resto de apps del servidor
    restart: unless-stopped

  # Descarga el modelo la primera vez (~2 GB) y termina. Reintenta: "ollama" puede no estar
  # aceptando conexiones todavía justo cuando este contenedor arranca (depends_on solo espera a
  # que el contenedor se inicie, no a que el servidor HTTP esté listo), y sin reintento ese fallo
  # deja a "app" sin arrancar nunca (depende de que "model" termine con éxito).
  model:
    image: ollama/ollama:latest
    depends_on: [ollama]
    environment:
      - OLLAMA_HOST=ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
    entrypoint: ["sh", "-c", "for i in $(seq 1 40); do ollama pull \"$$OLLAMA_MODEL\" && exit 0; echo 'ollama no está listo todavía, reintentando...'; sleep 3; done; exit 1"]
    restart: "no"
    x-exclude_from_hc: true

volumes:
  mongo-data:
  ollama-data:
